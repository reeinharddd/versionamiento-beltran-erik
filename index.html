<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGHT SHIFT — Organiza tu noche</title>

    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="siteHeader">
        <h1>NIGHT SHIFT</h1>
        <p class="tagline">ORGANIZA TU NOCHE. NO PIERDAS EL RITMO.</p>
    </header>

    <section class="stats" aria-label="Resumen del turno">
        <div class="statCard"><span id="statBlocks" class="statValue">00</span><span class="statLabel">BLOQUES</span></div>
        <div class="statCard"><span id="statMinutes" class="statValue">00</span><span class="statLabel">MINUTOS</span></div>
        <div class="statCard"><span class="statValue statMode">NIGHT</span><span class="statLabel">ACTIVE</span></div>
    </section>

    <div class="container">

        <div class="formContainer">
            <h2>NUEVA ACTIVIDAD</h2>

            <label for="name">Actividad:</label>
            <input type="text" id="name" placeholder="Escribe qué harás esta noche">

            <label for="duration">Duración (minutos):</label>
            <input type="number" id="duration" placeholder="60" min="1">

            <button id="addActivity" type="button">+ AGREGAR AL TURNO</button>
            <p id="formAviso" class="formAviso" hidden></p>
        </div>

        <section class="timeline">
            <h2>NIGHT TIMELINE</h2>
            <div id="blocks"></div>
            <p id="emptyState" class="emptyState" hidden>Sin bloques todavía. Agrega tu primera actividad del turno.</p>
        </section>
    </div>

    <script src="functions.js"></script>
</body>
</html>
